<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados e Perdidos - Nova senha</title>
    <link rel="stylesheet" href="css/nova-senha.css">
</head>
<body>
<main class="pagina-nova-senha">
    <section class="nova-senha-container" aria-labelledby="titulo-nova-senha">
        <h1 id="titulo-nova-senha">RECUPERE SUA SENHA</h1>

        <form class="form-nSenha" action="index.html">
            <div class="campo-formulario">
                <label for="nova-senha">nova senha</label>
                <input type="password" id="nova-senha" name="nova-senha" required>
            </div>

            <div class="campo-formulario">
                <label for="confirmar-senha">confirmar nova senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" required>
            </div>

            <button type="submit">ENTRAR</button>
        </form>
    </section>
    <div class="imagem-login" aria-hidden="true"></div>
</main>
</body>
</html>
