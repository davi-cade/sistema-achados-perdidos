<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados e Perdidos - Recuperação de senha</title>
    <link rel="stylesheet" href="css/recuperar-senha.css">
</head>
<body>
<main class="pagina-recuperacao">
    <section class="recuperacao-container" aria-labelledby="titulo-recuperacao">
        <h1 id="titulo-recuperacao">RECUPERE SUA SENHA</h1>

        <form action="codigo-email.html">
            <div class="campo-formulario">
                <label for="email">email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo-formulario">
                <label for="matricula">matricula</label>
                <input type="text" id="matricula" name="matricula" required>
            </div>

            <button type="submit">proximo</button>
        </form>
    </section>
</main>
</body>
</html>
